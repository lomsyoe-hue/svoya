<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a1a5c;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.s{display:none;height:100dvh;padding:16px;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;background:radial-gradient(circle at 50% 20%,#1a3bbf,#0a1a5c 70%);overflow-y:auto}

input[type=text],select{padding:14px;font-size:18px;border-radius:12px;border:0;width:240px;text-align:center}

.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #ffd23f;background:#2a4bd6}

/* комната */

.cell.empty{display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.4;border-style:dashed}
.ai,.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,12,.72);padding:3px 4px;text-align:center;font-size:13px;line-height:1.15}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#bw{position:relative;flex:none;width:100%;aspect-ratio:16/9}

#bn img,#bn video{width:100%;height:100%;object-fit:contain}
.bar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center}

#st{font-size:12px;color:#ffd23f}
#bd{display:none;position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff2d3d;color:#fff;font-size:13px;font-weight:800;line-height:22px;text-align:center;box-shadow:0 0 0 2px #0a1a5c,0 0 12px #ff2d3d;animation:pulse 1.2s infinite;z-index:5}
@media (orientation:landscape){
 .stage{display:grid;grid-template-columns:minmax(0,1fr) min(40%,190px);grid-template-rows:minmax(0,1fr) 54px;grid-template-areas:"bw pl" "hs pl";justify-items:center;align-items:center}
 .pl{grid-area:pl;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;align-self:start}
 #bw{grid-area:bw;height:100%;width:auto;max-width:100%}
 #hs{grid-area:hs;width:100%;height:54px;flex:none;min-height:0}
 button.g{padding:7px 9px;font-size:14px}.s{padding:8px}
}

#ans.on{display:block}#ans.r{background:linear-gradient(90deg,#c1121f,#ff4d4d);animation:pulse 1s infinite}#ans.gr{background:#1f8f55}
#ovl{position:absolute;inset:0;z-index:4;border-radius:14px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;pointer-events:none;background:radial-gradient(circle,#1a3bbf,#050a2e 78%)}

.ot{font-size:clamp(15px,4.6vw,28px);font-weight:800;color:#ffd23f}
.os{font-size:clamp(18px,6vw,36px);font-weight:900;text-shadow:0 3px 0 #a67c00;margin:2px 0}
.num{font-size:clamp(54px,21vw,140px);font-weight:900;color:#ffd23f;line-height:1;animation:pop 1s ease-out both;text-shadow:0 0 24px #ffb300}
.ring{position:absolute!important;z-index:1!important;width:40%;aspect-ratio:1;border:5px solid #ffd23f;border-radius:50%;animation:ring 1s ease-out both}
.goT{font-size:clamp(34px,13vw,92px);font-weight:900;color:#ffd23f;text-shadow:0 0 30px #ff9800;animation:zoom .55s ease-out both}
.dr{font-size:clamp(48px,17vw,110px);animation:drm .1s infinite alternate}
.wn{font-size:clamp(26px,9vw,56px);font-weight:900;animation:glow .8s infinite alternate;word-break:break-word;padding:0 8px}
#ovl #fx{position:absolute;inset:0;width:100%;height:100%;z-index:1}

@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(3);opacity:0}}

@keyframes glow{from{text-shadow:0 0 8px #ffd23f}to{text-shadow:0 0 28px #ff9800,0 0 40px #ffd23f}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px) rotate(8deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
#hg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
#hg button{min-width:0;padding:11px 14px;font-size:16px}#hg .ok{background:#3fb97a}

#hg .red.hot{animation:pulse .8s infinite}#hg .red:disabled{background:#4a4f6e;box-shadow:none;font-size:18px;opacity:.85}

.cell.f1{background:linear-gradient(#16296e,#16296e) padding-box,conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00) border-box}
.cell.f2{background:linear-gradient(#16296e,#16296e) padding-box,repeating-linear-gradient(45deg,#ff4d6d 0 6px,#fff 6px 12px) border-box}
.cell.f3{background:linear-gradient(#16296e,#16296e) padding-box,repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/10px 10px border-box}
.cell.f4{background:linear-gradient(#16296e,#16296e) padding-box,linear-gradient(0deg,#ff3d00,#ffb300,#fff176) border-box;box-shadow:0 0 10px #ff6d00}
.cell.f5{background:linear-gradient(#16296e,#16296e) padding-box,linear-gradient(135deg,#00e5ff,#2979ff,#00e5ff) border-box;box-shadow:0 0 10px #00e5ff}
.cell.f6{background:linear-gradient(#16296e,#16296e) padding-box,radial-gradient(circle,#fff 2px,transparent 2.6px) 0 0/8px 8px border-box,linear-gradient(#e91e63,#e91e63) border-box}
.cell.f7{background:linear-gradient(#16296e,#16296e) padding-box,repeating-linear-gradient(45deg,#7c4dff 0 4px,transparent 4px 8px) border-box,repeating-linear-gradient(-45deg,#7c4dff 0 4px,#d1c4e9 4px 8px) border-box}
.cell.f8{background:linear-gradient(#16296e,#16296e) padding-box,linear-gradient(90deg,#e0a387 2px,transparent 2px) 0 0/14px 14px border-box,repeating-linear-gradient(0deg,#8d3b2b 0 12px,#e0a387 12px 14px) border-box}
.cell.f9{background:linear-gradient(#16296e,#16296e) padding-box,linear-gradient(90deg,#f0f,#0ff,#ff0,#f0f) 0 0/300% 100% border-box;animation:shift 3s linear infinite}
@keyframes shift{to{background-position:0 0,300% 0}}
.frs{display:grid;grid-template-columns:repeat(5,56px);gap:8px}.fw{position:relative;width:56px;height:56px;border-radius:12px}.fw.sel{outline:3px solid #ffd23f;outline-offset:2px}
#brd{display:none;position:absolute;inset:0;z-index:3;background:rgba(5,10,46,.97);border-radius:12px;padding:4px;flex-direction:column;gap:3px}#brd.on{display:flex}
.bh{font-size:12px;text-align:center;color:#ffd23f}.bh b{color:#fff}
.bg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(5,minmax(0,1fr));gap:3px}
.bgc{background:#1a3bbf;color:#ffd23f;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;padding:2px;line-height:1.05}
.bv{background:#2a4bd6;color:#ffd23f;font-weight:900;font-size:17px;border:0;border-radius:6px;padding:0;min-width:0;min-height:0}.bv:disabled{background:#2a4bd6;color:#ffd23f;opacity:.85}.bv.u:disabled{background:#141a44;color:#141a44;opacity:1}
#qs{display:none;position:absolute;top:6px;left:6px;right:6px;z-index:3;padding:4px 8px;border-radius:10px;background:rgba(5,10,46,.88);border:2px solid #ffd23f;font-weight:800;font-size:14px;text-align:center;pointer-events:none}#qs.on{display:block}.tm{color:#ff6b6b}
#ovl.fin{background:linear-gradient(100deg,#8a0f1c 0 46%,#050a2e 46% 54%,#0d3a99 54%)}
#ovl.fin::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;animation:flash 2.4s infinite;z-index:3}
.vsr{display:flex;align-items:center;justify-content:center;gap:10px}.fp{display:flex;flex-direction:column;align-items:center}
.fp img{width:clamp(48px,18vw,100px);aspect-ratio:1;border-radius:50%;border:4px solid #ffd23f;object-fit:cover;box-shadow:0 0 18px #ffb300}
.fp b{font-size:clamp(14px,4.5vw,24px)}.fp small{font-size:clamp(12px,3.5vw,18px);color:#ffd23f}
.fp.l{animation:inL .9s ease-out both}.fp.r{animation:inR .9s ease-out both}
.vsx{font-size:clamp(26px,9vw,56px);font-weight:900;color:#ffd23f;animation:vs .6s infinite alternate;text-shadow:0 0 16px #ff6d00}
@keyframes inL{from{transform:translateX(-140%);opacity:0}}@keyframes inR{from{transform:translateX(140%);opacity:0}}
@keyframes vs{to{transform:scale(1.3)}}@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.8}93%{opacity:0}95%{opacity:.6}}
.bsv{width:100%;height:100%;display:block}.fz{transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fall{from{transform:translate(0,-12px) rotate(0)}to{transform:translate(-18px,100px) rotate(240deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes bobc{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pant{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(1.25)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

@keyframes popt{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
</style></head><body>

<div class="s on" id="menu"><h1>СВОЯ<br>ИГРА</h1>
<div class="prof"><img class="av" id="mav"><b id="mnm"></b></div>
<button onclick="go('start')">Начать игру</button>
<button onclick="openSet()">⚙️ Настройки</button>
<div class="hint">версия 7</div></div>

<div class="s" id="start"><h1>Игра</h1>
<button onclick="go('crt')">Создать комнату</button>
<button onclick="go('jn')">Присоединиться</button>
<button class="g" onclick="go('menu')">← Назад</button></div>

<div class="s" id="set"><h1>Настройки</h1>
<img class="av big" id="sav">
<div class="hint" style="min-height:0">Выберите котика:</div>
<div class="cats" id="cats"></div>
<label class="btn g">🖼 Выбрать из галереи<input type="file" accept="image/*" onchange="pickAva(this)"></label>
<div class="hint" style="min-height:0">Рамка вокруг аватарки:</div>
<div class="frs" id="frs"></div>
<input type="text" id="nm" maxlength="14" placeholder="Ваш ник">
<button onclick="saveSet()">Сохранить</button>
<button class="g" onclick="go('menu')">← Назад</button></div>

<div class="s" id="crt"><h1>Комната</h1>
<div>Сколько игроков (без ведущего)</div>
<select id="sz"><option>2</option><option>3</option><option selected>4</option></select>
<button id="cb" onclick="create()">Создать</button>
<div class="hint">Вы станете ведущим. Появится код — отправьте его игрокам и не закрывайте эту страницу.</div>
<button class="g" onclick="go('start')">← Назад</button></div>

<div class="s" id="jn"><h1>Вход</h1>
<input type="text" id="jc" maxlength="5" placeholder="КОД КОМНАТЫ" style="text-transform:uppercase">
<button id="jb" onclick="join()">Войти</button>
<div class="hint" id="js"></div>
<button class="g" onclick="location.reload()">← Назад</button></div>

<div class="s" id="room">
<div class="stage"><div class="pl">
<div class="pw"><div class="slot" id="p1"></div><div class="sc" id="sc1"></div></div>
<div class="pw"><div class="slot" id="p2"></div><div class="sc" id="sc2"></div></div>
<div class="pw"><div class="slot" id="p3"></div><div class="sc" id="sc3"></div></div>
<div class="pw"><div class="slot" id="p4"></div><div class="sc" id="sc4"></div></div></div>
<div id="bw"><div id="bn"></div><div id="brd"></div><div id="qs"></div><div id="ans"></div><div id="ovl"></div></div>
<div class="slot" id="hs"></div></div>
<div id="hg"></div>
<div class="bar">
<button class="g off" id="mic" onclick="toggleMic()">🔇 Микро выкл</button>
<button class="g" id="hear" onclick="toggleHear()">🔊 Слышу</button>
<button class="g off" id="cam" onclick="toggleCam()">📷 Выкл</button>
<button class="g" onclick="toggleChat()">💬 Чат<span id="bd">0</span></button>
<button class="g" onclick="copyCode()">Код: <span id="code"></span></button>
<button class="g" id="addb" style="display:none" onclick="$('#sp').classList.remove('on');$('#pan').classList.toggle('on')">🎬 Баннер</button>
<button class="g off" onclick="location.reload()">Выйти</button><span id="st"></span></div>
<div id="pan">
<div class="wrap"><label class="btn g">🔍 Фото/видео<input type="file" accept="image/*,video/*" id="bf"></label>
<label class="btn g">🎵 Музыка<input type="file" accept="audio/*" id="bm"></label></div>
<div class="wrap"><button class="g" onclick="showBanner()">📺 Показать всем</button><button class="g off" onclick="clearBanner()">🧹 Убрать</button><button class="g" onclick="$('#pan').classList.remove('on')">Закрыть</button></div>

<div class="sec">Видео</div>
<div class="pr"><button class="g" id="vp" onclick="togV()">⏸</button><span>Громкость</span><input type="range" id="vv" min="0" max="100" value="100" oninput="applyVol()"><button class="g" id="vm" onclick="muteV()">🔊</button></div>

<div class="pr"><button class="g" id="mp" onclick="togM()">⏸</button><span>Громкость</span><input type="range" id="mv" min="0" max="100" value="60" oninput="applyVol()"><button class="g" id="mm" onclick="muteM()">🔊</button></div>
</div>

<div id="cf"><input id="ci" type="text" maxlength="200" placeholder="Сообщение…" style="text-align:left;width:auto" onkeydown="if(event.key=='Enter')sendChat()"><button class="g" onclick="sendChat()">➤</button></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const P='sg7-';
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}];
const mkPeer=id=>new Peer(id,{config:{iceServers:ICE},debug:0});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DA="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#1e3a9e'/><circle cx='50' cy='38' r='18' fill='#ffd23f'/><path d='M18 95C18 66 82 66 82 95' fill='#ffd23f'/></svg>");

function shrink(f,m,sq){return new Promise(r=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,sx=0,sy=0,sw=w,sh=h;
 if(sq){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=m}else{const k=Math.min(1,m/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,sx,sy,sw,sh,0,0,w,h);r(c.toDataURL('image/jpeg',.78))};i.src=URL.createObjectURL(f)})}

async function toggleMic(){
 if(muted){
  if(!micStream){try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){alert('Микрофон не разрешён. Разрешите доступ к микрофону в браузере и нажмите кнопку ещё раз.');return}

   Object.values(calls).forEach(c=>{try{const sn=c.peerConnection.getSenders().find(x=>x.track&&x.track.kind=='audio');if(sn)sn.replaceTrack(t)}catch(e){}});
   local=micStream}
  micStream.getAudioTracks().forEach(t=>t.enabled=true);muted=false
 }else{if(micStream)micStream.getAudioTracks().forEach(t=>t.enabled=false);muted=true}
 const b=$('#mic');b.textContent=muted?'🔇 Микро выкл':'🎤 Микро вкл';b.classList.toggle('off',muted);sendUpd()}

 c.classList.toggle('host',!!p.host);c.classList.toggle('ans',G.rd=='ans'&&G.ans==id);c.classList.toggle('turn',G.ph=='play'&&!G.fin&&G.turn==id);c.classList.toggle('out',!!G.final&&!p.host&&!G.fl.includes(id));

function render(){
 const order=Object.keys(players).filter(i=>i!=hostId&&players[i]),win=G.fin=='win'?G.win:[];
 $('.pl').style.setProperty('--n',max);
 for(let i=0;i<4;i++){const sl=$('#p'+(i+1)),sc=$('#sc'+(i+1)),id=order[i];let el;sl.parentElement.style.display=i<max?'':'none';
  if(id){updCell(id);el=cell(id);sc.innerHTML='⭐ '+(players[id].pts||0)+(win.includes(id)?' <span class="cr">👑</span>':((G.fin=='fin'||G.final)&&G.fl.includes(id)?' ⚔️':''))}
  else{el=document.createElement('div');el.className='cell empty';el.textContent=i<max?'Свободно':'—';sc.innerHTML=''}

 document.querySelectorAll('.cv').forEach(v=>{if(v.style.display=='block')v.play().catch(()=>{})});
 for(const id of Object.keys({...calls,...bcalls,...camCalls,...rcam}))if(!players[id]&&id!=hostId)dropCall(id)}

async function create(){$('#cb').disabled=true;max=Math.max(2,Math.min(4,+$('#sz').value));local=silentStream();isHost=true;tryId()}
function tryId(){code=rc();hostId=P+code;peer=mkPeer(hostId);
 peer.on('open',()=>{if(started)return;players[hostId]={name:me.name,ava:me.ava,host:1,mic:false,cam:false};startRoom()});
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();tryId()}else if(['network','server-error','socket-error','socket-closed','disconnected'].includes(e.type))fixConn();else if(!started)alert('Ошибка связи: '+e.type);});
 peer.on('connection',hostConn);peer.on('call',onCall)}
function pushState(){bc({t:'state',players,max,code,g:G});applyG(1);if(isHost)syncCalls()}
function hostConn(c){
 c.on('data',d=>{
  if(d.t=='upd'&&players[c.peer]){players[c.peer].mic=d.mic;players[c.peer].cam=d.cam;pushState();return}
  if(d.t=='buzz'&&players[c.peer]&&G.ph=='play'&&!G.fin){
   if(G.rd=='offer'&&G.off==c.peer){G.rd='ans';G.ans=c.peer;startT(10,()=>{G.tried.push(G.ans);offerNext()});return}
   if(G.rd=='open'&&!G.tried.includes(c.peer)&&plist().includes(c.peer)){G.rd='ans';G.ans=c.peer;pushG();return}return}
  if(d.t=='pick'&&players[c.peer]){doPick(d.c|0,d.p|0,c.peer);return}
  if(d.t=='chat'&&players[c.peer]){const x=String(d.x).slice(0,200),n=players[c.peer].name;hist.push([n,x]);if(hist.length>50)hist.shift();bc({t:'chat',n,x,i:c.peer});addChat(n,x,0);return}
  if(d.t!='join')return;
  if(Object.keys(players).length-1>=max){c.send({t:'full'});setTimeout(()=>c.close(),600);return}
  conns[c.peer]=c;players[c.peer]={name:String(d.name).slice(0,14),ava:d.ava,fr:(d.fr|0)%10,mic:false,cam:false};pushState();
  if(hist.length)c.send({t:'hist',h:hist});
  if(curImg)c.send({t:'img',src:curImg});
  if(curBnr!=null)c.send({t:'bnr',i:curBnr});
  if(bs&&bs.getTracks().length)callPeer(c.peer,bs,{k:'b'})});
 c.on('close',()=>{delete conns[c.peer];delete players[c.peer];dropCall(c.peer);
  if(G.ans==c.peer||G.off==c.peer){G.tried.push(c.peer);if(G.q){stopT();offerNext()}else{G.ans=null;G.rd='open'}}
  if(G.turn==c.peer)G.turn=nextTurn();pushState()})}

async function join(){const c=$('#jc').value.trim().toUpperCase();if(!c)return;$('#jb').disabled=true;$('#js').textContent='Подключение…';
 local=silentStream();code=c;hostId=P+c;attempt(1)}
function attempt(n){const pr=mkPeer();peer=pr;let ok=0,done=0;
 const fail=m=>{if(done||ok)return;done=1;try{pr.destroy()}catch(e){}
  if(n<3){$('#js').textContent='Попытка '+(n+1)+' из 3…';setTimeout(()=>attempt(n+1),900)}else{$('#js').textContent=m;$('#jb').disabled=false}};
 pr.on('open',()=>{const cn=pr.connect(hostId,{reliable:true});
  cn.on('open',()=>{ok=1;conns[hostId]=cn;cn.send({t:'join',name:me.name,ava:me.ava,fr:me.fr})});
  cn.on('data',onData);cn.on('close',()=>{alert('Связь с ведущим потеряна');location.reload()});
  cn.on('error',e=>fail('Не удалось соединиться ('+e.type+')'))});
 pr.on('call',onCall);
 pr.on('error',e=>fail(e.type=='peer-unavailable'?'Комната не найдена. Проверьте код. У вас и у ведущего должна быть открыта версия 7 (обновите страницу), а ведущий не должен закрывать сайт.':'Нет связи с сервером ('+e.type+'). Попробуйте другой интернет (Wi-Fi или мобильный).'));
 setTimeout(()=>fail('Не удалось соединиться. Попробуйте другой интернет (Wi-Fi или мобильный) и обновите страницу.'),9000)}
function onData(d){
 if(d.t=='full'){alert('Комната заполнена');location.reload()}
 if(d.t=='state'){players=d.players;max=d.max;if(d.g)G=d.g;if(!started)startRoom();applyG(1);syncCalls()}
 if(d.t=='bnr')showBnrLocal(d.i);
 if(d.t=='g'){G=d.g;applyG()}
 if(d.t=='chat')addChat(d.n,d.x,d.i==peer.id);
 if(d.t=='hist')d.h.forEach(m=>addChat(m[0],m[1],1));
 if(d.t=='img')$('#bn').innerHTML=`<img src="${d.src}">`;
 if(d.t=='clr'){$('#bn').innerHTML='';const a=$('#ba');if(a)a.srcObject=null}}
/* ---------- звонки ---------- */
function callPeer(id,s,meta){const c=peer.call(id,s,{metadata:meta});hook(c,id,meta.k,true);return c}
function onCall(c){const k=c.metadata&&c.metadata.k;c.answer(k=='v'?local:undefined);hook(c,c.peer,k,false)}
function hook(c,id,k,out){
 if(k=='v')calls[id]=c;else if(k=='b')bcalls[id]=c;else if(out)camCalls[id]=c;else rcam[id]=c;
 c.on('stream',s=>{
  if(k=='v'){let a=aud[id];if(!a){a=aud[id]=document.createElement('audio');a.autoplay=true;document.body.append(a)}a.srcObject=s;a.muted=deaf;a.play().catch(()=>{})}
  else if(k=='b')showStream(s);
  else if(!out){streams[id]=s;render()}});
 c.on('close',()=>{
  if(k=='v'&&calls[id]===c)delete calls[id];
  if(k=='b'&&bcalls[id]===c)delete bcalls[id];
  if(k=='c'){if(out){if(camCalls[id]===c)delete camCalls[id]}else if(rcam[id]===c){delete rcam[id];delete streams[id];render()}}})}
function syncCalls(){if(!peer)return;const my=peer.id;
 for(const id in players){if(id==my)continue;
  if(!calls[id]&&(isHost||(!players[id].host&&id>my)))callPeer(id,local,{k:'v'});
  if(camStream&&!camCalls[id])callPeer(id,camStream,{k:'c'})}}
function dropCall(id){[calls[id],bcalls[id],camCalls[id],rcam[id]].forEach(c=>c&&c.close());delete calls[id];delete bcalls[id];delete camCalls[id];delete rcam[id];delete streams[id];if(aud[id]){aud[id].remove();delete aud[id]}}
function showStream(s){const b=$('#bn');
 if(s.getVideoTracks().length){let v=b.querySelector('video');if(!v){b.innerHTML='';v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.onclick=()=>v.play();b.append(v)}v.muted=deaf;v.srcObject=s;v.play().catch(()=>{})}
 else{let a=$('#ba');if(!a){a=document.createElement('audio');a.id='ba';a.autoplay=true;document.body.append(a)}a.muted=deaf;a.srcObject=s;a.play().catch(()=>{})}}

 const f=$('#bf').files[0],m=$('#bm').files[0];if(!f&&!m)return alert('Сначала выберите фото/видео или музыку');
 stopLocal();bc({t:'clr'});
 ctx=ctx||new (window.AudioContext||webkitAudioContext)();await ctx.resume();
 const dest=ctx.createMediaStreamDestination(),ms=new MediaStream(),b=$('#bn');
 vG=ctx.createGain();mG=ctx.createGain();applyVol();
 const wire=(el,g)=>{ctx.createMediaElementSource(el).connect(g);g.connect(dest);g.connect(ctx.destination)};
 if(f&&f.type.startsWith('image/')){curImg=await shrink(f,1200,false);b.innerHTML=`<img src="${curImg}">`;bc({t:'img',src:curImg})}
 if(f&&f.type.startsWith('video/')){const v=document.createElement('video');v.src=URL.createObjectURL(f);v.playsInline=true;v.loop=true;b.append(v);vEl=v;wire(v,vG);await v.play().catch(()=>{});
  const st=v.captureStream?v.captureStream():null;if(st)st.getVideoTracks().forEach(t=>ms.addTrack(t));else alert('Этот браузер не передаёт видео. Откройте сайт в Chrome на Android.');$('#vp').textContent='⏸'}
 if(m){mEl=new Audio(URL.createObjectURL(m));mEl.loop=true;wire(mEl,mG);mEl.play().catch(()=>{});$('#mp').textContent='⏸'}
 dest.stream.getAudioTracks().forEach(t=>ms.addTrack(t));bs=ms;
 Object.keys(conns).forEach(id=>callPeer(id,ms,{k:'b'}));
 $('#pan').classList.remove('on')}

   if(q.k){q.r+=.2;c.save();c.translate(q.x,q.y);c.rotate(q.r);c.fillRect(-3,-2,7,4);c.restore()}else{c.beginPath();c.arc(q.x,q.y,q.s,0,7);c.fill()}});

function AC(){ctx=ctx||new (window.AudioContext||webkitAudioContext)();if(ctx.state=='suspended')ctx.resume();return ctx}
function tone(f,d,ty,v,w){const c=AC(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(w||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
function noise(d,f,v,w,hp){const c=AC(),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+(w||0);s.buffer=b;fl.type=hp?'highpass':'lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t)}
function sfx(k,a){try{

 else if(k=='buzz'){tone(180,.45,'sawtooth',.2);tone(120,.45,'square',.12)}
 else if(k=='pop'){noise(.15,2000,.18,0,1);tone(700,.1,'sine',.12)}
 else if(k=='fan'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.18,i*.12));noise(1.5,4000,.25,0,1)}
 else if(k=='final'){tone(70,.9,'sine',.5);tone(55,1.3,'sawtooth',.18);noise(1.2,900,.3);[392,523,659].forEach((f,i)=>tone(f,.4,'square',.1,.5+i*.15))}
 else if(k=='drum'){let t=0;while(t<5){noise(.1,350,.08+t*.04,t);t+=Math.max(.04,.16-t*.026)}noise(1.4,3500,.3,5,1);tone(70,.7,'sine',.5,5)}
}catch(e){}}
